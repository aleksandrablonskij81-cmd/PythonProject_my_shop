{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
    <div class="form-container">
        <h2>{{ title }}</h2>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            {% for field in form %}
                <div>
                    {{ field.label_tag }}
                    {{ field }}
                    {% if field.errors %}
                        <div style="color: red;">{{ field.errors }}</div>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit">Сохранить</button>
        </form>

        <a href="{% url 'blog:blog_list' %}" class="btn-back">← Назад к списку</a>
    </div>
{% endblock %}
