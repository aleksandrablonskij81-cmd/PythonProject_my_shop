{% extends 'catalog/base.html' %}

{% block title %}Контакты{% endblock %}

{% block content %}
<h1 class=mb-4>Контактная информация</h1>

<div class=row>
    <div class=col-md-6>
        <div class=card>
            <div class=card-body>
                <h5 class=card-title>Свяжитесь с нами</h5>
                <ul class=list-group list-group-flush>
                    <li class=list-group-item>📧 Email: {{ email }}</li>
                    <li class=list-group-item>📞 Телефон: {{ phone }}</li>
                    <li class=list-group-item>📍 Адрес: {{ address }}</li>
                </ul>
            </div>
        </div>
    </div>
    
    <div class=col-md-6>
        <div class=card>
            <div class=card-body>
                <h5 class=card-title>Форма обратной связи</h5>
                <form>
                    <div class=mb-3>
                        <label for=name class=form-label>Имя</label>
                        <input type=text class=form-control id=name placeholder=Ваше имя>
                    </div>
                    <div class=mb-3>
                        <label for=email class=form-label>Email</label>
                        <input type=email class=form-control id=email placeholder=your@email.com>
                    </div>
                    <div class=mb-3>
                        <label for=message class=form-label>Сообщение</label>
                        <textarea class=form-control id=message rows=3></textarea>
                    </div>
                    <button type=submit class=btn btn-primary>Отправить</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
