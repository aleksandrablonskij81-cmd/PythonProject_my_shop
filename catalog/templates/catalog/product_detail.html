{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="product-detail">
        <h1>{{ product.name }}</h1>

        {% if product.image %}
            <img src="{{ product.image.url }}" alt="{{ product.name }}" style="max-width: 100%; max-height: 400px; object-fit: contain;">
        {% endif %}

        <div class="price">{{ product.price }} ₽</div>
        <div class="description">{{ product.description|linebreaks }}</div>

        <p style="color: #95a5a6; font-size: 14px;">Добавлен: {{ product.created_at|date:"d.m.Y H:i" }}</p>

        <div class="product-actions">
            <a href="{% url 'catalog:product_update' pk=product.pk %}" class="btn">✏️ Редактировать</a>
            <a href="{% url 'catalog:product_delete' pk=product.pk %}" class="btn" style="background: #e74c3c;">🗑️ Удалить</a>
        </div>

        <a href="{% url 'catalog:product_list' %}" class="btn-back">← Назад к списку</a>
    </div>
</div>
{% endblock %}
