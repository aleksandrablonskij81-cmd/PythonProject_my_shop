{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>{% if form.instance.pk %}Редактировать товар{% else %}Добавить товар{% endif %}</h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="mb-3">
            <label for="id_name" class="form-label">Название</label>
            {{ form.name }}
        </div>

        <div class="mb-3">
            <label for="id_description" class="form-label">Описание</label>
            {{ form.description }}
        </div>

        <div class="mb-3">
            <label for="id_category" class="form-label">Категория</label>
            {{ form.category }}
        </div>

        <div class="mb-3">
            <label for="id_price" class="form-label">Цена (руб.)</label>
            {{ form.price }}
        </div>

        <div class="mb-3">
            <label for="id_image" class="form-label">Изображение</label>
            {{ form.image }}
        </div>

        <button type="submit" class="btn btn-success">Сохранить</button>
        <a href="{% url 'catalog:product_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
